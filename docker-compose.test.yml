services:
  db-test:
    image: postgres:18
    container_name: hero-ranker-db-test
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hero_ranker_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql

volumes:
  postgres_test_data:
